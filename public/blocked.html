<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="utf-8">
  <title>Chwila oddechu — Unruminate</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="blocked.css">
  <link rel="icon" type="image/png" href="icon_32.png">
  <script type="module" src="blocked.mjs"></script>
</head>

<body>
  <main class="center-stage">
    <div id="site-meta" class="site-meta">
      <span id="site-rule" class="site-rule"></span>
      <span id="site-count" class="site-count" hidden></span>
    </div>

    <!-- Hero Centered Circular 30s Countdown -->
    <div id="ring-wrapper" class="ring-wrapper" aria-live="polite">
      <div class="ring-glow" aria-hidden="true"></div>
      <svg class="ring-svg" viewBox="0 0 280 280">
        <circle class="ring-track" cx="140" cy="140" r="124"></circle>
        <circle id="ring-progress" class="ring-progress" cx="140" cy="140" r="124"></circle>
      </svg>
      <div class="ring-center">
        <div id="ring-number-stage" class="ring-number-stage">
          <span id="countdown-number" class="ring-number">30</span>
          <div id="number-blur-veil" class="number-blur-veil" aria-hidden="true"></div>
        </div>
        <span id="countdown-label" class="ring-label">weź spokojny oddech</span>
      </div>
    </div>

    <div id="countdown-paused-hint" class="paused-hint" hidden>
      odliczanie zatrzymane — wróć na tę kartę
    </div>

    <!-- Minimal Arrow Trigger + Collapsible Unlock Drawer -->
    <div class="drawer-container">
      <button
        id="drawer-toggle"
        type="button"
        class="drawer-toggle"
        aria-expanded="false"
        aria-controls="unlock-drawer"
      >
        <span id="drawer-toggle-text">wpisz powód</span>
        <svg class="chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="5 8 10 13 15 8"></polyline>
        </svg>
      </button>

      <div id="unlock-drawer" class="drawer-collapse" data-open="false">
        <div class="drawer-collapse-inner">
          <div class="unlock-drawer">
            <form id="unlock-form" novalidate>
              <div class="category-tabs">
                <label class="cat-tab">
                  <input type="radio" name="category" value="NEED">
                  <span data-cat-label="NEED">Potrzeba</span>
                </label>
                <label class="cat-tab">
                  <input type="radio" name="category" value="BOREDOM">
                  <span data-cat-label="BOREDOM">Nuda</span>
                </label>
                <label class="cat-tab">
                  <input type="radio" name="category" value="RUMINATION">
                  <span data-cat-label="RUMINATION">Ruminacja</span>
                </label>
                <label class="cat-tab">
                  <input type="radio" name="category" value="OTHER">
                  <span data-cat-label="OTHER">Inne</span>
                </label>
              </div>

              <div class="drawer-field">
                <textarea
                  id="reason-input"
                  rows="1"
                  placeholder="Po co dokładnie tu wchodzisz? (zapisze się w historii)"
                ></textarea>
                <div class="field-meta">
                  <span id="reason-counter">0 / 10 znaków</span>
                </div>
              </div>

              <div class="drawer-row">
                <select id="duration-select" aria-label="Czas odblokowania">
                  <option value="5">5 min</option>
                  <option value="10">10 min</option>
                  <option value="15" selected>15 min</option>
                  <option value="30">30 min</option>
                </select>

                <input
                  id="ai-code-input"
                  type="text"
                  autocomplete="off"
                  spellcheck="false"
                  placeholder="Kod (XXXX-XXXX)"
                  maxlength="12"
                  hidden
                >
              </div>

              <div id="form-error" class="form-error" hidden></div>

              <button id="unlock-button" type="submit" class="btn-unlock" disabled>
                Odczekaj
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bottom-bar">
    <div id="awareness-stats" class="awareness-stats" hidden></div>
    <div class="bottom-icons">
      <button id="close-tab-button" type="button" class="icon-btn" title="Zamknij kartę" aria-label="Zamknij kartę">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <a id="history-link" href="options.html#history-section" class="icon-btn" title="Historia wejść" aria-label="Historia wejść">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path>
          <path d="M3 3v5h5"></path>
          <path d="M12 7v5l3 2"></path>
        </svg>
      </a>
      <a id="settings-link" href="options.html" class="icon-btn" title="Ustawienia" aria-label="Ustawienia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </a>
    </div>
  </footer>
</body>

</html>
